ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true

    # Frame IDs
    output_frame: base_link
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    publish_tf: true

    # Only odometry input
    odometry0: /odom
    odometry0_config: [true,  true,  false,
                       false, false, true,
                       false, false, false,
                       false, false, true]
    odometry0_differential: false
    odometry0_queue_size: 10
